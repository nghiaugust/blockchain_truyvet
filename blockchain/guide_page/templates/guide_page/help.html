{% include "bitcoin/sidebar.html" %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Tracker - Công cụ Phân tích và Truy vết Bitcoin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hero-section {
            /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
            background: linear-gradient(135deg, #667eea 0%, #5ac198 100%);
            color: white;
            padding: 5rem 0;
            text-align: center;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: 100%;
            color: #333;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #667eea;
        }

        .cta-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            /* background: linear-gradient(45deg, #667eea, #5ac198); */
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            color: #333;
        }

        .feature-section {
            padding: 5rem 0;
        }
    </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero-section">
      <div class="container">
          <div class="row">
              <div class="col-lg-12">
                  <h1 class="hero-title">Bitcoin Tracker Document</h1>
                  <p class="hero-subtitle">Trình truy vết và phân tích giao dịch Bitcoin</p>
                  <a href="{% url 'bitcoin:graph_view' %}" class="cta-button">
                    <i class="bi bi-diagram-3 me-2"></i>Bắt đầu phân tích
                  </a>
                  <a href="{% url 'guide_page:introduction' %}" class="cta-button">
                    <i class="bi bi-back"></i> Quay lại trang giới thiệu
                  </a>
              </div>
          </div>
      </div>
  </section>

  <!-- Feature Section -->
  <section class="feature-section"> 
    
  </section>


  <!-- Footer -->
  <footer class="py-4 text-center" style="background-color: #343a40; color: white;">
    <div class="container">
        <p class="mb-0">&copy;Thêm nội dung footer ở đây nhé ạ</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
